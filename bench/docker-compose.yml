services:
  bench-runner:
    build:
      context: ..
      dockerfile: bench/Dockerfile
    image: ozy-bench-runner:latest
    env_file:
      # Optional — a clean checkout runs zero-config against the default free
      # model. Copy bench/.env.example to .env to override.
      - path: ../.env
        required: false
    environment:
      - OZY_BENCH_FIXTURE_DIR=/fixture
      - OZY_BENCH_BIN=/usr/local/bin/ozy-bench
      - OZY_BENCH_CORPUS_DIR=/bench/corpus
      # The live tier drives an OpenCode built-in model. Zero-config default; set
      # BENCH_MODEL to any model the pinned OpenCode resolves.
      - BENCH_MODEL=${BENCH_MODEL:-}
      # Forwarded from the host so `make bench SCENARIO=… MODE=… BENCH_RUNS=…`
      # reaches the harness (the command below reads these from the container env).
      - SCENARIO=${SCENARIO:-}
      - MODE=${MODE:-}
      - BENCH_RUNS=${BENCH_RUNS:-}
      # Hard per-run timeout (seconds); the harness bounds a stalled model run.
      - BENCH_TIMEOUT=${BENCH_TIMEOUT:-900}
    volumes:
      # Only runs/ is writable (artifacts land here). scenarios/configs/corpus are
      # read-only inputs. No host home, repo root, or ~/.claude is mounted — so
      # OpenCode's upward skill-walk finds nothing to leak.
      - ./runs:/bench/runs
      - ./scenarios:/bench/scenarios:ro
      - ./configs:/bench/configs:ro
      - ./corpus:/bench/corpus:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        echo "=== Generating fixture ==="
        rm -rf /fixture
        ozy-bench fixture --scenario "$${SCENARIO:-historical-weather-report}" --out /fixture
        export OZY_BENCH_FIXTURE_DIR=/fixture
        echo "=== Running benchmark ==="
        ozy-bench run \
          --scenario "$${SCENARIO:-historical-weather-report}" \
          --mode "$${MODE:-all}" \
          --runs "$${BENCH_RUNS:-5}"
